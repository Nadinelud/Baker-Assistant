# Build APK dan taruh di GitHub Releases.
# - Push tag versi (misalnya `git tag v1.0.0 && git push origin v1.0.0`): build + Release berisi APK.
# - Jalankan manual dari tab Actions: build saja, APK bisa diunduh dari bagian Artifacts.
# Kunci tanda tangan diambil dari GitHub Secrets (lihat bagian "Build APK" di CLAUDE.md).
name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Nomor versi Android harus selalu naik supaya APK baru bisa memperbarui app yang terpasang.
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pasang dependensi
        run: npm ci

      - name: Tes dan typecheck
        run: |
          npm test -- --ci
          npm run typecheck

      - name: Tentukan versi
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION_NAME=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_ENV"
          fi

      - name: Siapkan kunci tanda tangan
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diisi. Lihat bagian Build APK di CLAUDE.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Buat folder android
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        env:
          NODE_ENV: production
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Beri nama APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/BakerAssistant-$APP_VERSION_NAME.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: BakerAssistant-${{ env.APP_VERSION_NAME }}
          path: out/*.apk

      - name: Buat Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.apk \
            --title "Baker Assistant $APP_VERSION_NAME" \
            --notes "Unduh file .apk di bawah, buka di HP Android, lalu izinkan pemasangan dari sumber ini. Kalau sudah ada versi lama, data tetap aman (APK ini memperbarui app). Tetap ekspor backup dulu sebelum memperbarui."
